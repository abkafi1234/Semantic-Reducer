name: Test and Publish

# Tests run on every push and pull request.
# Publishing happens only when a GitHub Release is published, and only if the
# tests pass first.
on:
  push:
    branches: [main, master]
  pull_request:
  release:
    types: [published]

jobs:
  test:
    name: Test on Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.11", "3.12"]

    steps:
    - name: Checkout source code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    # torch and transformers are NOT installed: they are imported lazily inside
    # SemanticReducer, so the clustering guarantees can be tested with numpy and
    # faiss-cpu alone. This keeps CI to seconds rather than pulling ~2 GB.
    - name: Install test dependencies
      run: |
        python -m pip install --upgrade pip
        pip install numpy faiss-cpu tqdm pytest

    - name: Run property tests
      env:
        PYTHONPATH: src
      run: pytest tests/ -v

  pypi-publish:
    name: Build and publish to PyPI
    needs: test                      # never publish a build whose tests failed
    if: github.event_name == 'release'
    runs-on: ubuntu-latest

    # REQUIRED for PyPI Trusted Publishing (OIDC)
    # This block allows GitHub to securely authenticate with PyPI without any passwords.
    permissions:
      id-token: write
      contents: read

    steps:
    - name: Checkout source code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"

    - name: Install build dependencies
      run: |
        python -m pip install --upgrade pip
        pip install build

    - name: Build package distributions
      run: python -m build

    - name: Publish package to PyPI
      uses: pypa/gh-action-pypi-publish@release/v1
      # Note: No 'with: password: ...' is needed because of the permissions block above!
